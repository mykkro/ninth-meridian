<!doctype html><meta charset="utf-8"><title>City menu</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';game.reputationState().cities.prague=-8;render();
 const center=doc.getElementById('scene-heading'),before=center.textContent;doc.getElementById('open-city').click();const modal=doc.getElementById('city-dialog');assert(modal.open,'City button opens dialog');await new Promise(r=>setTimeout(r,100));const header=modal.querySelector('.modal-close-bar'),heading=doc.getElementById('city-title'),close=header.querySelector('.modal-close');assert(header.contains(heading),'Title in header');const hr=heading.getBoundingClientRect(),cr=close.getBoundingClientRect();assert(Math.abs((hr.top+hr.height/2)-(cr.top+cr.height/2))<3,'Title and close align');assert(doc.querySelector('#city [data-city=prague]'),'Current city');assert(doc.querySelector('#city [data-standing=distrusted]'),'Local reputation');assert(doc.querySelector('#city [data-quest-id=main]'),'Local main quest');assert(center.textContent===before&&center.isConnected,'Center preserved');const gold=game.state.gold;doc.querySelector('#city .temple-donation button').click();assert(game.state.gold===gold-20&&game.reputationState().cities.prague===-4,'City donation updates purse and reputation');assert(doc.querySelector('#city .temple-donation button').disabled&&doc.querySelector('#exploration .temple-donation button').disabled,'Donation shared between panels');await Promise.all([...doc.querySelectorAll('#city img')].map(img=>img.decode()));doc.querySelector('#city [data-quest-id=main] button').click();assert(!modal.open&&doc.getElementById('quest-log-dialog').open,'Quest link opens details');doc.getElementById('quest-log-dialog').close();game.state.milestones.push('prague');render();doc.getElementById('open-city').click();assert(!doc.querySelector('#city [data-quest-id=main]'),'Resolved local clue hidden');language.value='cs';render();assert(doc.getElementById('city-title').textContent==='Město','Czech title');modal.close();game.state.location='berlin';render();doc.getElementById('open-city').click();assert(doc.querySelector('#city [data-city=berlin]'),'Updates at new destination');doc.getElementById('reset').click();assert(!modal.open,'Reset closes City');
 results.dataset.status='passed';results.textContent='PASS: City dialog, reputation, local quests, quest details, preserved center, localization, destination refresh and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
