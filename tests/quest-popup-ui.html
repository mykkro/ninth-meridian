<!doctype html><meta charset="utf-8"><title>Quest completion notifications</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change')),say=id=>{const index=game.visibleChoices().findIndex(({choice})=>choice.phrase===id);assert(index>=0,'Choice '+id);const button=doc.querySelectorAll('#choices button')[index];assert(!button.disabled,'Choice available');button.click();},notifications=doc.getElementById('quest-notifications');
 game.state.knowledge.el=100;doc.querySelector('#npcs button').click();say('ada_ask');say('ada_answer');assert(!notifications.children.length,'Progress alone does not notify');say('ada_accept');
 assert(notifications.matches(':popover-open')&&notifications.textContent.includes('Úkol dokončen!'),'Czech completion appears');assert(notifications.textContent.includes('Odměna')&&notifications.textContent.includes(frame.contentWindow.t(game.world.items.map.name)),'Actual map reward shown');assert(notifications.querySelector('img.item-icon').getAttribute('src')==='assets/items/map.svg','Map reward icon');assert(notifications.querySelector('.quest-unlocks').textContent.includes(frame.contentWindow.t(game.world.locations.find(place=>place.id==='bratislava').name)),'Newly unlocked destination in completion popup');assert(!doc.querySelector('#locations button[data-location="bratislava"]').disabled,'Unlocked city available in sidebar');notifications.querySelector('button').click();assert(!notifications.matches(':popover-open'),'Dismissible');
 for(const locale of ['en','cs']){
  language.value=locale;game.state.location='athens';game.state.milestones=game.state.milestones.filter(id=>!id.startsWith('harbour_lights'));game.state.rewarded=game.state.rewarded.filter(id=>id!=='harbour_lights');game.state.inventory.salt=2;game.open('thalia');render();doc.getElementById('open-dialogue').click();say('harbour_lights_accept');assert(!notifications.children.length,'Accepting quest does not notify');
  say('harbour_lights_deliver');const toast=notifications.lastElementChild;
  assert(toast.textContent.includes(locale==='en'?'Quest completed!':'Úkol dokončen!'),'Localized completion');assert(toast.textContent.includes(locale==='en'?'Harbour lights':'Přístavní světla'),'Quest title');assert(toast.textContent.includes('×2')&&toast.textContent.includes('40'),'Item quantity and actual money reward');assert(!toast.textContent.includes(locale==='en'?'Bag of salt':'Sáček soli'),'Consumed items not shown as rewards');
  const bounds=toast.getBoundingClientRect(),hit=doc.elementFromPoint(bounds.x+20,bounds.y+20);assert(hit?.closest('.quest-toast')===toast,'Visible above modal '+JSON.stringify({x:bounds.x,y:bounds.y,w:bounds.width,h:bounds.height,hit:hit?.outerHTML.slice(0,150),open:notifications.matches(':popover-open')}));const beforeDismiss=doc.getElementById('locations').getBoundingClientRect().y;toast.querySelector('button').click();assert(doc.getElementById('locations').getBoundingClientRect().y===beforeDismiss,'Toast dismissal does not shift layout');
  game.state.inventory.salt=2;game.open('thalia',true,true);render();const replayIndex=game.visibleChoices().findIndex(({choice})=>choice.phrase==='harbour_lights_deliver');assert(doc.querySelectorAll('#choices button')[replayIndex].disabled,'Completed reward cannot be claimed on replay');doc.querySelectorAll('#choices button')[replayIndex].click();assert(!notifications.children.length,'No duplicate on replay');doc.getElementById('dialogue-modal').close();
 }
 game.state.location='prague';game.state.milestones=game.state.milestones.filter(id=>id!=='prague');game.open('ada',true,true);render();say('ada_ask');say('ada_answer');say('ada_accept');assert(notifications.children.length,'Another completion visible');doc.getElementById('reset').click();assert(!notifications.children.length&&!notifications.matches(':popover-open'),'New voyage clears notifications');
 for(const id of Object.keys(game.world.items))game.state.inventory[id]=2;render();
 const rows=[...doc.querySelectorAll('#inventory .item')];assert(rows.length===Object.keys(game.world.items).length,'Every item has inventory entry');
 await Promise.all(rows.map(async row=>{const icon=row.querySelector('img.item-icon');assert(icon&&icon.getAttribute('src')==='assets/items/'+row.dataset.item+'.svg','Matching inventory icon '+row.dataset.item);await icon.decode();assert(icon.naturalWidth>0,'Icon loads '+row.dataset.item);assert(row.querySelector('.inventory-item-title').textContent.includes('×2'),'Quantity retained');}));
 results.dataset.status='passed';results.textContent='PASS: completion-only popups, Czech/English titles, real money/item rewards, quantities, top-layer visibility over dialogue, stable layout, dismissal, replay protection, reset, and all 89 inventory icons loading with quantities.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
