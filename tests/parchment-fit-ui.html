<!doctype html><meta charset="utf-8"><title>Map viewport fit</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){frame.style.width='1366px';frame.style.height='768px';let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));const doc=frame.contentDocument,win=frame.contentWindow,game=win.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();game.state.inventory.map=1;
 for(const locale of ['cs','en']){doc.getElementById('ui-language').value=locale;doc.getElementById('ui-language').dispatchEvent(new Event('change'));const title=win.t('Unroll map');[...doc.querySelectorAll('#inventory button')].find(button=>button.textContent===title).click();const map=doc.getElementById('parchment-map');
  for(const [width,height]of [[1366,768],[1280,600],[1024,600],[390,640],[844,390]]){frame.style.width=width+'px';frame.style.height=height+'px';await new Promise(resolve=>setTimeout(resolve,60));const bounds=map.getBoundingClientRect(),chart=map.querySelector('svg').getBoundingClientRect(),close=map.querySelector('.modal-close').getBoundingClientRect();assert(bounds.top>=0&&bounds.bottom<=win.innerHeight+1&&bounds.left>=0&&bounds.right<=win.innerWidth+1,'Dialog fits viewport '+width+' '+height);assert(map.scrollHeight<=map.clientHeight+1&&map.scrollWidth<=map.clientWidth+1,'No internal scroll');assert(chart.height>0&&chart.bottom<=bounds.bottom&&chart.right<=bounds.right,'Whole chart fits');assert(close.top>=bounds.top&&close.right<=bounds.right,'Close control visible');assert(map.querySelectorAll('.parchment-label').length>=game.world.locations.length,'All city labels retained');}
  map.querySelector('.modal-close').click();assert(!map.open,'Map closes normally');
 }
 results.dataset.status='passed';results.textContent='PASS: complete parchment map and close control fit laptop, short laptop, phone and landscape viewports without scrolling in Czech/English.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
