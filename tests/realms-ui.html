<!doctype html><meta charset="utf-8"><title>Historic realm labels</title>
<pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results');const assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));const doc=frame.contentDocument,win=frame.contentWindow,game=win.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();const language=doc.getElementById('ui-language');const render=()=>language.dispatchEvent(new Event('change'));
 const rows=[['lviv','Kyjevská Rus','Kyivan Rus','ruthenia'],['novgorod','Novgorodská republika','Novgorod Republic','novgorod'],['florence','Florentská republika','Republic of Florence','florence'],['venice','Benátská republika','Republic of Venice','venice'],['bologna','Papežský stát','Papal States','papal-states'],['toledo','Kastilská koruna','Crown of Castile','castile'],['amsterdam','Holandské hrabství','County of Holland','holland'],['copenhagen','Dánské království · Kalmarská unie','Kingdom of Denmark · Kalmar Union','denmark'],['oslo','Norské království · Kalmarská unie','Kingdom of Norway · Kalmar Union','norway'],['stockholm','Švédské království','Kingdom of Sweden','sweden'],['turku','Österland · Švédské království','Österland · Kingdom of Sweden','sweden'],['athens','Athénské vévodství','Duchy of Athens','greece']];
 for(const [id,cs,en,crest]of rows){game.state.location=id;game.open(game.npcsHere()[0]);for(const [locale,title]of [['cs',cs],['en',en]]){language.value=locale;render();const card=doc.querySelector('.country-context');assert(card.querySelector('h3').textContent===title,'Realm heading '+id+' '+locale);assert(doc.getElementById('locations').textContent.includes(title),'Destination title');assert(card.querySelector('img').src.endsWith('country-'+crest+'.svg'),'Matching realm crest');await card.querySelector('img').decode();const mapTitle=[...doc.querySelectorAll('.map-marker title')].find(el=>el.textContent.startsWith(win.t(game.world.locations.find(place=>place.id===id).name)+' ·'));assert(mapTitle?.textContent.includes(title),'Map tooltip title');}}
 game.state.location='bologna';language.value='en';render();assert(doc.querySelector('.country-context').textContent.includes('Sante Bentivoglio'),'Bologna local government described');game.state.location='florence';render();assert(!doc.querySelector('.country-context').textContent.includes('Duke'),'Florence has no ducal title');assert(game.world.locations.find(place=>place.id==='florence').country==='Italy','GIS key retained');assert(!game.transportOptions('galway').some(quote=>quote.id!=='boat'),'No new oversea horse route');
 results.dataset.status='passed';results.textContent='PASS: twelve historic realm titles in Czech/English, destination labels, map tooltips, local political briefs, matching crests, and geographic travel keys.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
