<!doctype html><meta charset="utf-8"><title>Sidebar dialogs</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';render();
 assert(!doc.querySelector('aside.party-sidebar #inventory')&&!doc.querySelector('aside.party-sidebar #journal'),'Sidebar contents moved out');for(const id of ['inventory','quest-log','journal','tales-rumors'])assert(doc.getElementById('open-'+id),'Launcher '+id);
 doc.getElementById('open-inventory').click();assert(doc.getElementById('inventory-dialog').open,'Inventory opens');assert(doc.querySelector('#inventory img.item-icon'),'Item icons retained');doc.getElementById('inventory-dialog').querySelector('.modal-close').click();assert(!doc.getElementById('inventory-dialog').open,'Inventory closes');
 doc.getElementById('open-quest-log').click();assert(doc.getElementById('quest-log-dialog').open,'Quest log opens');assert(doc.querySelectorAll('#quest-log .quest-status-group').length===3,'Three status groups');assert(doc.querySelector('#quest-log [data-status=active] article'),'Main quest initially active');
 game.state.milestones.push('prague');const questEntry=Object.entries(game.world.quests).find(([id,q])=>q.completion&&q.kind!=='investigation');game.state.milestones.push(questEntry[0]+'_started');render();assert(doc.querySelector('#quest-log [data-status=progress] article'),'Main quest in progress');game.state.milestones.push(questEntry[1].completion);render();assert(doc.querySelector('#quest-log [data-status=finished] .item'),'Finished side quest listed');doc.getElementById('quest-log-dialog').close();
 doc.getElementById('open-journal').click();assert(doc.getElementById('journal-dialog').open&&doc.querySelector('#journal .journal-event'),'Journal shows events');doc.querySelectorAll('#journal .journal-tabs button')[1].click();assert(doc.querySelector('#journal .journal-conversation'),'Conversations retained');doc.getElementById('journal-dialog').close();
 game.state.inventory.map=1;render();doc.getElementById('open-inventory').click();[...doc.querySelectorAll('#inventory button')].find(b=>b.textContent==='Unroll map').click();assert(!doc.getElementById('inventory-dialog').open&&doc.querySelector('dialog.parchment-map').open,'Item action closes inventory and opens map');doc.querySelector('dialog.parchment-map').close();
 doc.getElementById('open-tales-rumors').click();assert(doc.getElementById('tales-rumors-dialog').open,'Rumors open separately');assert(doc.getElementById('tales-rumors').textContent.includes('Ask locals'),'Empty rumors guidance');doc.getElementById('tales-rumors-dialog').close();
 results.dataset.status='passed';results.textContent='PASS: compact sidebar launchers, inventory modal and item action, quest status groups and progression, journal events/conversations, modal closing.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
