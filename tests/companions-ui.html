<!doctype html><meta charset="utf-8"><title>Character menu</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';render();doc.getElementById('open-companions').click();const modal=doc.getElementById('companions-dialog');assert(modal.open,'Opens companion dialog');assert(doc.getElementById('companions').textContent.includes('Travelling alone'),'Empty party');assert(!modal.querySelector('.speech-toggle'),'No utility speech toggle');game.state.companions=['tereza'];game.state.metCompanions=['tereza','mira'];render();assert(doc.querySelector('#companions-current [data-companion=tereza]'),'Current companion');assert(doc.getElementById('companions-current').textContent.includes('Travel route'),'Route details');assert(doc.querySelector('#known-companions [data-companion=mira]'),'Encountered companion');assert(!doc.querySelector('#known-companions [data-companion=tereza]'),'Current not duplicated');await Promise.all([...modal.querySelectorAll('img')].map(i=>i.decode()));language.value='cs';render();assert(doc.getElementById('companions-title').textContent==='Společníci','Czech title');doc.getElementById('reset').click();assert(!modal.open,'Reset closes dialog');results.dataset.status='passed';results.textContent='PASS: companion dialog, empty state, current details, encountered list, portraits, localization and reset';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
