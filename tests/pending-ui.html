<!doctype html><meta charset="utf-8"><title>Character menu</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');html=html.replace(/(<script src="audio\.js[^>]*><\/script>)/,'$1<script>const OriginalSounds=VoyageSounds;window.VoyageSounds=class extends OriginalSounds{constructor(){super();window.testSounds=this;this.cues=[];}play(kind){if(this.enabled)this.cues.push(kind);}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='cs';render();assert(doc.getElementById('settings').contains(language),'Language in Settings');assert(doc.querySelector('#settings .sound-toggle'),'Sound in Settings');assert(!doc.querySelector('header .language-switch')&&!doc.querySelector('header .sound-toggle'),'Header compact');doc.getElementById('open-settings').click();assert(doc.getElementById('settings-dialog').open,'Settings opens');const difficulty=doc.getElementById('difficulty');difficulty.value='training';difficulty.dispatchEvent(new Event('change'));assert(game.state.training,'Training selected');doc.getElementById('settings-dialog').close();game.state.location='galway';game.open('niamh');render();assert(doc.querySelector('#conversation .note[lang=cs]'),'Training Czech dialogue');assert(doc.querySelector('#scene-heading .port-icon'),'Galway port badge');const reference=doc.querySelector('#library-shelf [data-book=riddle_nature]');assert(reference,'Irish reference available');reference.click();await new Promise(r=>setTimeout(r,100));const reader=doc.querySelector('.book-reader');assert(reader.querySelector('.book-page').lang==='ga','Irish original edition');assert(reader.querySelector('.training-book-translation[lang=cs]'),'Training Czech book translation');reader.close();difficulty.value='easy';difficulty.dispatchEvent(new Event('change'));reference.click();assert(!reader.querySelector('.training-book-translation'),'No Czech without Training');assert(reader.querySelector('.lore-language select').options.length===1,'No translator, only Irish');reader.close();game.state.location='berlin';game.open('berlinShop');game.nodeId='trade';game.ended=false;render();const gold=game.state.gold;const purchase=[...doc.querySelectorAll('#choices button')].find(b=>b.textContent.toLowerCase().includes('svitek'));assert(purchase,'Scroll purchase button: '+doc.getElementById('choices').textContent+' / '+game.nodeId+' / '+doc.getElementById('notice').textContent);purchase.click();assert(game.state.gold<gold&&doc.querySelector('.purchase-toast'),'Purchase cost bubble');assert(frame.contentWindow.testSounds.cues.includes('coins'),'Purchase coin sound');assert(doc.querySelector('#scene-heading .native-country-name'),'Native country caption');await Promise.all(game.world.locations.filter(l=>l.innkeeper).map(async l=>{const image=new frame.contentWindow.Image();image.src=new URL('assets/cities/'+l.id+'.png',doc.baseURI).href;await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;});assert(image.naturalWidth>500,'City artwork '+l.id);}));assert(doc.querySelector('#scene-heading .city-preview'),'Scene preview');doc.getElementById('open-city').click();assert(doc.querySelector('#city .city-preview'),'City dialog preview');doc.getElementById('city-dialog').close();results.dataset.status='passed';results.textContent='PASS: Settings placement, Training, original Irish books, port badge, country caption and purchase bubble.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
