<!doctype html><meta charset="utf-8"><title>Grouped destinations</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,win=frame.contentWindow,game=win.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change')),groups=()=>[...doc.querySelectorAll('#locations .destination-country')];
 assert(groups()[0].dataset.country==='Czechia','Starting country first');assert(doc.querySelectorAll('#locations button').length===game.world.locations.filter(place=>game.canTravel(place.id)).length,'Only unlocked destinations');assert(!doc.querySelector('#locations button[data-location="galway"]'),'Unknown Galway hidden');const realCanTravel=game.canTravel.bind(game);game.canTravel=()=>true;
 game.state.visitedLocations=['prague','florence','london','hamburg','venice','galway','berlin'];
 for(const locale of ['cs','en']){language.value=locale;render();const expected=['Czechia','Italy','England (Britain)','Germany','Ireland'];assert(groups().slice(0,5).every((section,index)=>section.dataset.country===expected[index]),'Countries ordered by first arrival');
  for(const section of groups()){const places=[...section.querySelectorAll('button')].map(button=>game.world.locations.find(place=>place.id===button.dataset.location));assert(places.every(place=>place.country===section.dataset.country),'Country membership');const names=places.map(place=>win.t(place.name)),sorted=[...names].sort(new Intl.Collator(locale,{sensitivity:'base'}).compare);assert(JSON.stringify(names)===JSON.stringify(sorted),'Alphabetical localized cities');assert(section.querySelector('h3 img'),'Country heraldry');}
 }
 const seen=doc.querySelector('#locations button[data-location="florence"]'),unseen=doc.querySelector('#locations button[data-location="bologna"]');assert(seen.classList.contains('visited')&&!unseen.classList.contains('visited'),'Visited city distinction');assert(win.getComputedStyle(seen.querySelector('.destination-city-title')).color!==win.getComputedStyle(unseen.querySelector('.destination-city-title')).color,'Visited title colour differs');game.state.visitedLocations.push('prague','bologna');render();assert(groups()[1].dataset.country==='Italy','Revisit does not move country');
 game.canTravel=realCanTravel;render();assert(!doc.querySelector('#locations button[data-location="galway"]'),'Locked city hidden after refresh');const current=doc.querySelector('#locations button.active');assert(current.dataset.location==='prague','Current city retained');const pressburg=doc.querySelector('#locations button[data-location="bratislava"]');game.state.milestones.push('prague');render();doc.querySelector('#locations button[data-location="bratislava"]').click();assert(doc.getElementById('travel-modal').open,'Grouped destination opens transport');doc.getElementById('travel-modal').close();
 doc.getElementById('reset').click();assert(groups()[0].dataset.country==='Czechia','New voyage resets country order');
 results.dataset.status='passed';results.textContent='PASS: country groups, first-visit country order, localized city sorting, revisits, unlocked destinations only, heraldry, current city, quest gates, transport and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
