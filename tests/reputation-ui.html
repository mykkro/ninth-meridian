<!doctype html><meta charset="utf-8"><title>Reputation and recovery</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';game.state.native='en';game.state.knowledge.cs=0;render();assert(doc.querySelector('#player [data-scope="city"] svg'),'City icon visible');assert(doc.querySelector('#npcs [data-scope="person"]').dataset.standing==='neutral','Neutral person icon');
 const say=id=>{const index=game.visibleChoices().findIndex(({choice})=>choice.phrase===id);assert(index>=0,'Visible '+id);doc.querySelectorAll('#choices button')[index].click();};
 doc.getElementById('open-dialogue').click();say('ada_rude');assert(doc.querySelector('.reputation-summary').textContent.includes('-8'),'City reputation shown');assert(doc.querySelector('#npcs [data-scope="person"]').dataset.standing==='distrusted','Distrust icon');assert(doc.querySelector('#player [data-scope="city"]').title.includes('Distrusted'),'City tooltip explains icon');
 game.open('ada',true,true);render();say('ada_ask');say('ada_answer');const accept=doc.querySelectorAll('#choices button')[game.visibleChoices().findIndex(({choice})=>choice.phrase==='ada_accept')];assert(accept.disabled&&accept.textContent.includes('Restore local trust'),'Low trust blocks clues with explanation');
 game.open('ada',true,true);render();say('ada_rude');game.open('ada',true,true);render();assert(doc.querySelector('#conversation .line').textContent.includes('I will not discuss'),'Refusal visible');assert(doc.querySelector('#npcs [data-scope="person"]').dataset.standing==='hostile','Hostile icon');assert(doc.querySelector('#npcs .npc-reputation').textContent.includes('-36'),'Personal standing visible');doc.getElementById('dialogue-modal').close();
 while(game.canHelpCommunity()){const help=doc.querySelector('.community-repair button');assert(help&&!doc.getElementById('exploration').hidden,'Recovery visible even without gathering sources');help.click();}
 assert(game.state.voyageDay>0&&!doc.querySelector('.community-repair'),'Work takes time and stops at neutral');game.open('ada',true,true);render();doc.getElementById('open-dialogue').click();say('ada_ask');say('ada_answer');say('ada_accept');assert(game.state.inventory.map===1&&game.reputation('ada').person>0,'Recovered trust allows completion and gain');assert(doc.querySelector('#npcs [data-scope="person"]').dataset.standing==='friendly','Friendly icon after quest');game.changeReputation(20,20,0,'test');render();assert(doc.querySelector('#npcs [data-scope="person"]').dataset.standing==='respected','Respected icon');doc.getElementById('dialogue-modal').close();doc.getElementById('reset').click();assert(game.reputation('ada').person===0,'Reset clears standing');
 results.dataset.status='passed';results.textContent='PASS: city and personal reputation displayed, clue gate, refusal, community work recovery, quest gains and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
