<!doctype html><meta charset="utf-8"><title>Speech controls</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');html=html.replace('<head>','<head><script>window.spoken=[];Object.defineProperty(window,"speechSynthesis",{value:{getVoices:()=>[{lang:"en-GB"},{lang:"cs-CZ"}],cancel:()=>{},speak:u=>window.spoken.push({text:u.text,lang:u.lang}),addEventListener:()=>{}}});window.SpeechSynthesisUtterance=class{constructor(text){this.text=text;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language');language.value='en';language.dispatchEvent(new Event('change'));await new Promise(r=>setTimeout(r,100));const toggle=doc.querySelector('.speech-toggle');toggle.click();assert(toggle.getAttribute('aria-pressed')==='true','Toggle on');assert(!doc.querySelector('.sidebar-dialog .speech-toggle')&&!doc.querySelector('.travel-modal .speech-toggle'),'Utility dialogs have no speech toggle');assert(doc.querySelector('#dialogue-modal .speech-toggle'),'Dialogue retains speech control');assert(toggle.querySelector('svg')&&!toggle.textContent.trim()&&toggle.getAttribute('aria-label'),'Accessible icon toggle');
 const history=doc.createElement('div');history.className='transcript-body';const historyText=doc.createElement('p');historyText.lang='cs';historyText.textContent='Historická odpověď';const translated=doc.createElement('span');translated.className='note';translated.lang='en';translated.textContent='Translation [English · Scholar]';translated.dataset.speechText='Translation';history.append(historyText,translated);doc.body.append(history);await new Promise(r=>setTimeout(r,100));historyText.click();assert(frame.contentWindow.spoken.at(-1).text==='Historická odpověď'&&frame.contentWindow.spoken.at(-1).lang==='cs-CZ','History original language');translated.click();assert(frame.contentWindow.spoken.at(-1).text==='Translation'&&frame.contentWindow.spoken.at(-1).lang==='en-GB','Translation excludes attribution');translated.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));assert(frame.contentWindow.spoken.at(-1).text==='Translation','Keyboard translation');history.remove();
 const choice=doc.querySelector('#choices button:not(:disabled) .response-text');assert(choice,'Choice exists');const original=choice.textContent;choice.click();assert(frame.contentWindow.spoken.some(v=>v.text===original&&v.lang==='cs-CZ'),'Chosen reply speaks original language');
 const reader=doc.querySelector('dialog.book-reader')||[...doc.querySelectorAll('dialog')].find(d=>d.className.includes('book'));assert(reader,'Reader exists');reader.replaceChildren();const page=doc.createElement('section');page.className='book-page';page.lang='en';const passage=doc.createElement('p');passage.textContent='Translated lore passage';page.append(passage);reader.append(page);reader.showModal();await new Promise(r=>setTimeout(r,100));passage.click();assert(frame.contentWindow.spoken.at(-1).lang==='en-GB','Translated passage language');page.lang='cs';passage.click();assert(frame.contentWindow.spoken.at(-1).lang==='cs-CZ','Original passage language');const count=frame.contentWindow.spoken.length;page.lang='la';passage.click();assert(frame.contentWindow.spoken.length===count,'Latin unavailable');reader.close();toggle.click();passage.click();assert(frame.contentWindow.spoken.length===count,'Off disables playback');
 results.dataset.status='passed';results.textContent='PASS: speech toggle, dialogue reply original language, book original/translation language, Latin exclusion and off switch.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
