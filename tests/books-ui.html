<!doctype html><meta charset="utf-8"><title>Lore book reader</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language');language.value='en';const render=()=>language.dispatchEvent(new Event('change'));
 game.state.location='london';game.state.companions=['rowan'];render();
 const open=()=>[...doc.querySelectorAll('#library-shelf button')].find(button=>button.dataset.book==='lore_alchemy').click();open();
 assert(doc.querySelector('[data-book="lore_alchemy"] > .book-original-title > span').lang==='en','Shelf original language');assert(doc.querySelector('[data-book="lore_alchemy"] .note').textContent.includes('Trpělivá pec'),'Shelf interpreter title hint');
 const reader=doc.getElementById('reader')||doc.querySelector('dialog.book-reader');assert(reader?.open,'Book opens');
 assert(reader.querySelector('.lore-page').lang==='en','Original local copy');assert(reader.querySelectorAll('.lore-page p').length===2,'Distinct paragraphs');
 const select=reader.querySelector('.lore-language select');assert(select.options.length===2,'Companion adds Czech');select.value='cs';select.dispatchEvent(new Event('change'));assert(reader.querySelector('h2 > span').textContent==='The Patient Furnace'&&reader.querySelector('h2 .note').textContent.includes('Trpělivá pec'),'Original title retained with translator hint');assert(reader.querySelector('.lore-page').textContent.includes('Učeň'),'Translator translates page');
 for(let n=0;n<2;n++)reader.querySelector('[data-turn="next"]').click();assert(reader.querySelector('[data-turn="next"]').disabled,'Last page boundary');assert(reader.querySelector('.lore-page').textContent.includes('Západní'),'Page three translated');reader.querySelector('[data-turn="previous"]').click();assert(reader.querySelector('.lore-page').textContent.includes('Stříbrná'),'Previous page');reader.close();
 game.state.companions=[];render();assert(!doc.querySelector('[data-book="lore_alchemy"] .note'),'No title hint without interpreter');open();assert(reader.querySelector('.lore-language select').options.length===1,'No translator after dismissal');
 const scroll=reader.querySelector('.lore-translation button');assert(scroll,'Solo scroll translation available');scroll.click();assert(game.state.inventory.scroll_native===0,'One scroll consumed');assert(reader.querySelector('.lore-page').lang==='cs','Scroll reveals Czech');reader.querySelector('[data-turn="next"]').click();assert(reader.querySelector('.lore-page').lang==='cs','Whole book translated');reader.close();render();assert(doc.querySelector('[data-book="lore_alchemy"] .note').textContent.includes('Trpělivá pec'),'Saved scroll hints shelf title');open();assert(reader.querySelector('.lore-language select').options.length===2,'Scroll translation survives reopening');reader.close();
 game.state.location='krakow';game.state.companions=['mira'];render();[...doc.querySelectorAll('#library-shelf button')].find(button=>button.dataset.book==='lore_invaders').click();const sl=reader.querySelector('.lore-language select');assert([...sl.options].some(option=>option.value==='sk'),'Interpreter offers Slovak');sl.value='sk';sl.dispatchEvent(new Event('change'));assert(reader.querySelector('.lore-page').lang==='sk'&&reader.textContent.includes('Jazdec'),'Slovak translation available independent of UI language');
 reader.close();game.state.location='london';game.state.companions=['rowan'];render();doc.querySelector('[data-book="lore_western_tides"]').click();
 assert(reader.querySelector('h2 > span').textContent==="The Pilot's Book of Western Tides",'Long book original title');assert(reader.querySelector('.lore-language select').options.length===1,'Companion cannot translate full long work');const beforeGold=game.state.gold;reader.querySelector('[data-scholar]').click();assert(game.state.gold===beforeGold-300,'Scholar price charged');assert(reader.querySelector('.scholar-status')&&!reader.querySelector('.lore-page'),'Tome left with scholar');assert(doc.querySelector('.scholar-orders'),'Journal tracks tome');for(let n=0;n<3;n++)reader.querySelector('.book-controls button').click();assert(reader.querySelector('.scholar-status').textContent.includes('ready'),'Ready after three days');reader.querySelector('.book-controls button').click();assert(reader.querySelector('.lore-language select').value==='cs','Collected translation selected');assert(!doc.querySelector('.scholar-orders'),'Collected order removed');
 for(let n=0;n<5;n++){assert(!reader.querySelector('[data-turn="next"]').disabled,'Next page available');reader.querySelector('[data-turn="next"]').click();}
 assert(reader.querySelector('[data-turn="next"]').disabled&&reader.querySelector('.lore-page').textContent.includes('řetězy'),'Sixth page translated and bounded');assert(reader.querySelector('.book-controls').textContent.includes('6 / 6'),'Six-page counter');reader.querySelector('[data-turn="previous"]').click();assert(reader.querySelector('.lore-page').textContent.includes('Devátá hvězda'),'Long book turns back');reader.close();
 game.state.companions=[];game.state.inventory.scroll_native=1;render();doc.querySelector('[data-book="lore_western_tides"]').click();assert([...reader.querySelector('.lore-language select').options].some(option=>option.value==='cs'),'Paid long translation persists');assert(!reader.querySelector('.lore-translation button:not([data-scholar])'),'No scroll translation controls for long work');assert(game.state.inventory.scroll_native===1,'Long work leaves scroll intact');reader.close();game.state.gold=0;render();doc.querySelector('[data-book="lore_western_tides"]').click();assert(reader.querySelector('[data-scholar]').disabled,'Cannot hire without money');
 results.dataset.status='passed';results.textContent='PASS: local lore shelves, three- and six-page books, paragraph layout, full-page companion translations, paging boundaries, dismissal, solo scroll consumption, persistent scholar translation and payment, and Slovak output with English UI.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
