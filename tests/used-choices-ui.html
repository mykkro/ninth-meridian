<!doctype html><meta charset="utf-8"><title>Used dialogue choices</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));const doc=frame.contentDocument,win=frame.contentWindow,game=win.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();doc.querySelector('#npcs button').click();
 const choice=()=>doc.querySelectorAll('#choices button')[game.visibleChoices().findIndex(({choice})=>choice.phrase==='ada_ask')];assert(!choice().classList.contains('choice-used'),'Unused initially');choice().click();doc.getElementById('replay').click();assert(choice().classList.contains('choice-used')&&!choice().disabled,'Used colour without disabling');const unused=[...doc.querySelectorAll('#choices button')].find(button=>!button.classList.contains('choice-used'));assert(win.getComputedStyle(choice()).backgroundColor!==win.getComputedStyle(unused).backgroundColor,'Distinct subtle colour');assert(choice().title==='Dříve zvolená odpověď','Czech tooltip');doc.getElementById('ui-language').value='en';doc.getElementById('ui-language').dispatchEvent(new Event('change'));assert(choice().classList.contains('choice-used')&&choice().title==='Previously selected','Language change preserves history');doc.getElementById('reset').click();assert(!doc.querySelector('#choices .choice-used'),'Reset clears styling');
 results.dataset.status='passed';results.textContent='PASS: used choice colour, unused alternatives, enabled replay, localized tooltip, UI language changes and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
