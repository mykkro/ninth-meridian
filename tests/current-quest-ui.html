<!doctype html><meta charset="utf-8"><title>Current quest shortcut</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';render();const launch=()=>doc.querySelector('.current-quest-link').click(),selected=()=>doc.querySelector('#quest-log .quest-selected');
 launch();assert(doc.getElementById('quest-log-dialog').open&&selected().dataset.questId==='main','Main quest selected');assert(doc.activeElement===selected(),'Selected details focused');assert(selected().textContent.includes(frame.contentWindow.t(game.world.quest.title)),'Main details shown');doc.getElementById('quest-log-dialog').close();
 const [id,quest]=Object.entries(game.world.quests).find(([id,q])=>q.completion&&q.kind!=='investigation');game.state.location=quest.location;game.state.milestones.push(id+'_started');render();assert(doc.querySelector('.current-quest-link').dataset.questId===id,'Local active quest link');launch();assert(selected().dataset.questId===id&&selected().textContent.includes(frame.contentWindow.t(quest.title)),'Exact local quest selected');const bounds=selected().getBoundingClientRect(),modal=doc.getElementById('quest-log-dialog').getBoundingClientRect();assert(bounds.top>=modal.top&&bounds.top<modal.bottom,'Selected card brought into view');doc.getElementById('quest-log-dialog').close();
 const recovery=Object.entries(game.world.quests).find(([id,q])=>q.kind==='recovery');game.state.setbacks.push(recovery[0]);render();launch();assert(selected().dataset.questId===recovery[0],'Recovery takes priority');doc.getElementById('quest-log-dialog').close();
 game.state.setbacks=[];game.state.milestones.push(game.world.quest.finalMilestone);language.value='cs';render();launch();assert(selected().dataset.questId==='main'&&selected().closest('[data-status]').dataset.status==='finished','Completed voyage opens finished main details');results.dataset.status='passed';results.textContent='PASS: top quest link opens exact main/local/recovery/finished card, focuses details, scrolls into view, and works across UI languages.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
