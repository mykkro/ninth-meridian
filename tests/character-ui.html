<!doctype html><meta charset="utf-8"><title>Character menu</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';game.state.gold=12345;game.state.knowledge.sk=42;game.state.visitedLocations.push('berlin');const rep=game.reputationState();rep.cities.prague=-8;rep.cities.berlin=25;rep.countries.Czechia=-3;rep.people.ada=-30;render();const modal=doc.getElementById('character-dialog'),key=target=>target.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'c',bubbles:true}));
 key(doc.body);assert(modal.open,'C opens Character');assert(doc.querySelector('#character .character-purse strong').textContent===frame.contentWindow.coins(12345),'Exact coin balance');assert(doc.getElementById('character').textContent.includes('42/100'),'Language knowledge');assert(doc.querySelector('#character [data-city=prague] [data-standing=distrusted]'),'City reputation shown');assert(doc.querySelector('#character [data-city=berlin] [data-standing=respected]'),'Visited city reputation');assert(doc.querySelector('#character [data-person=ada] [data-standing=hostile]'),'Personal reputation');assert(!doc.querySelector('#character [data-city=galway]'),'Unknown cities hidden');await Promise.all([...doc.querySelectorAll('#character img')].map(img=>img.decode()));
 key(doc.body);assert(!modal.open,'C toggles closed');key(language);assert(!modal.open,'Typing in controls does not open menu');doc.getElementById('open-character').click();assert(modal.open,'Button opens menu');language.value='cs';render();assert(doc.getElementById('character-title').textContent==='Postava'&&doc.getElementById('character').textContent.includes('Pověst ve městech'),'Czech labels update');modal.close();doc.getElementById('reset').click();assert(!modal.open&&game.state.gold===100000,'New voyage resets profile');
 results.dataset.status='passed';results.textContent='PASS: Character button and C toggle, exact purse, languages, city/country/person standings, portraits, hidden unknown cities, input guard, localization and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
