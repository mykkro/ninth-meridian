<!doctype html><meta charset="utf-8"><title>Compact voyage summary</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:1000px;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);};
async function run(){let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await new Promise(resolve=>setTimeout(resolve,50));
 const doc=frame.contentDocument,win=frame.contentWindow,game=win.testVoyage;assert(game&&doc.getElementById('load-status').hidden,'Game loads');doc.getElementById('begin-voyage').click();const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change'));language.value='en';render();const summary=doc.getElementById('voyage-summary');assert(summary.textContent.includes('10 gold')&&summary.textContent.includes('The Ninth Meridian'),'Starting purse and main quest');assert(summary.getBoundingClientRect().right<=win.innerWidth,'Summary fits desktop');
 game.state.gold=20000;game.state.location='athens';game.state.milestones=['harbour_lights_started'];render();assert(summary.textContent.includes('2 gold')&&summary.textContent.includes('Harbour lights'),'Money and local quest update');game.state.milestones.push('harbour_lights_done');render();assert(!summary.textContent.includes('Harbour lights'),'Completed errand drops out');game.state.setbacks=['leipzig_restitution'];render();assert(summary.textContent.includes(win.t(game.world.quests.leipzig_restitution.title)),'Recovery task takes priority');game.state.setbacks=[];game.state.milestones.push('ireland');render();assert(summary.textContent.includes('Prepare the westward voyage'),'Ending objective');
 language.value='cs';render();assert(summary.textContent.includes('Aktuální úkol')&&summary.textContent.includes('Připravit západní plavbu'),'Localized labels and objective');
 frame.style.width='390px';await new Promise(resolve=>setTimeout(resolve,100));assert(summary.getBoundingClientRect().right<=win.innerWidth,'Summary fits mobile');assert(win.getComputedStyle(summary).position==='static','Mobile layout flows');doc.getElementById('reset').click();assert(summary.textContent.includes(win.t(game.world.quest.title)),'Reset restores quest');
 results.dataset.status='passed';results.textContent='PASS: compact money/current quest summary, live amounts, active errands, completion, recovery, final objective, Czech/English labels, responsive layout and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
