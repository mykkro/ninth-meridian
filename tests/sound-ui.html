<!doctype html><meta charset="utf-8"><title>Voyage sound cues</title><pre id="results">Running</pre><iframe id="game" title="Voyage"></iframe><style>iframe{width:100%;height:900px;border:0}</style>
<script>
const frame=document.getElementById('game'),results=document.getElementById('results'),assert=(value,message)=>{if(!value)throw Error(message);},pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function run(){localStorage.removeItem('voyage-sound');let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace(/(<script src="engine\.js[^>]*><\/script>)/,'$1<script>const OriginalEngine=DialogueEngine;window.DialogueEngine=class extends OriginalEngine{constructor(world){super(world);window.testVoyage=this;}};<\/script>').replace(/(<script src="audio\.js[^>]*><\/script>)/,'$1<script>const OriginalSounds=VoyageSounds;window.VoyageSounds=class extends OriginalSounds{constructor(){super();window.testSounds=this;this.cues=[];}play(kind){if(this.enabled)this.cues.push(kind);super.play(kind);}};<\/script>');frame.srcdoc=html;
 for(let n=0;n<600&&!frame.contentDocument?.getElementById('load-status')?.hidden;n++)await pause(50);
 const doc=frame.contentDocument,game=frame.contentWindow.testVoyage,sounds=frame.contentWindow.testSounds;assert(game&&doc.getElementById('load-status').hidden,'Game loads');assert(!sounds.context,'No audio before interaction');doc.getElementById('begin-voyage').click();
 const language=doc.getElementById('ui-language'),render=()=>language.dispatchEvent(new Event('change')),say=id=>{const index=game.visibleChoices().findIndex(({choice})=>choice.phrase===id);doc.querySelectorAll('#choices button')[index].click();};doc.querySelector('#npcs button').click();say('ada_ask');say('ada_answer');say('ada_accept');assert(sounds.cues.join()==='quest','Quest chime once');
 game.state.location='london';game.state.visitedLocations.push('london');game.state.milestones=[...game.world.quest.milestones];render();
 const travel=async id=>{doc.querySelector('#locations button[data-location="'+id+'"]').click();const modal=doc.getElementById('travel-modal');modal.querySelector('.transport-option').click();await pause(1100);modal.querySelector('.arrival-button').click();};
 await travel('hamburg');assert(sounds.cues.join()==='quest,arrival','First arrival chime');await travel('london');assert(sounds.cues.length===2,'Revisit stays quiet');
 const toggle=doc.querySelector('.sound-toggle input');toggle.checked=false;toggle.dispatchEvent(new Event('change'));assert(!sounds.enabled&&localStorage.getItem('voyage-sound')==='off','Mute preference saved');await travel('amsterdam');assert(sounds.cues.length===2,'Muted arrival quiet');language.value='en';render();assert(doc.querySelector('.sound-toggle').textContent==='Sound effects','English toggle');language.value='cs';render();assert(doc.querySelector('.sound-toggle').textContent==='Zvukové efekty','Czech toggle');assert(!toggle.checked,'Mute survives render');doc.getElementById('reset').click();assert(!sounds.enabled,'Mute survives new voyage');
 results.dataset.status='passed';results.textContent='PASS: silent startup, quest cue, first-arrival cue, quiet revisits, mute, saved preference, Czech/English toggle and reset.';
}run().catch(error=>{results.dataset.status='failed';results.textContent=error.stack;});
</script>
